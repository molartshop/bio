<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLART | STORE</title>
    <!-- Подключаем иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f11; /* Темный фон */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Блок с логотипом и текстом */
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .profile h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .profile p {
            font-size: 14px;
            color: #a0a0a5;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Блок с кнопками-ссылками */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: #1c1c1e;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            border: 1px solid #2c2c2e;
        }

        .link-card:hover {
            background-color: #2c2c2e;
            transform: translateY(-2px);
        }

        .link-icon {
            font-size: 24px;
            width: 32px;
            display: flex;
            justify-content: center;
            margin-right: 12px;
        }

        .link-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .link-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .link-subtitle {
            font-size: 12px;
            color: #8e8e93;
        }

        .link-action {
            color: #8e8e93;
            font-size: 16px;
        }

        /* Цвета иконок (по желанию можно изменить) */
        .tg-color { color: #0088cc; }
        .inst-color { color: #E1306C; }
        .tt-color { color: #ffffff; }
        .wa-color { color: #25D366; }
        .manager-color { color: #ff9900; } /* Цвет для кнопки менеджера */
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка профиля -->
        <div class="profile">
            <!-- ЗАМЕНИТЕ ССЫЛКУ НА ВАШЕ ЛОГО -->
            <img src="https://via.placeholder.com/150/000000/FFFFFF?text=MOLART" alt="MOLART Logo">
            <h1>MOLART | STORE</h1>
            <p>Ваш провідник у світ стилю та якості. Перегляньте наші соцмережі нижче або напишіть менеджеру напряму!</p>
        </div>

        <!-- Ссылки -->
        <div class="links">
            
            <!-- ЗАМЕНИТЕ ССЫЛКИ (href="...") НА СВОИ -->
            
            <!-- Кнопка менеджера (сделаем ее первой) -->
            <a href="https://t.me/molart_manager" class="link-card" target="_blank">
                <div class="link-icon manager-color"><i class="fa-solid fa-headset"></i></div>
                <div class="link-text">
                    <span class="link-title">Написати менеджеру</span>
                    <span class="link-subtitle">Замовлення та консультація</span>
                </div>
                <div class="link-action"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/molart_official" class="link-card" target="_blank">
                <div class="link-icon tg-color"><i class="fa-brands fa-telegram"></i></div>
                <div class="link-text">
                    <span class="link-title">Telegram</span>
                    <span class="link-subtitle">Наш канал та новини</span>
                </div>
                <div class="link-action"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/molart_official" class="link-card" target="_blank">
                <div class="link-icon inst-color"><i class="fa-brands fa-instagram"></i></div>
                <div class="link-text">
                    <span class="link-title">Instagram</span>
                    <span class="link-subtitle">Асортимент товарів</span>
                </div>
                <div class="link-action"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@molart_official" class="link-card" target="_blank">
                <div class="link-icon tt-color"><i class="fa-brands fa-tiktok"></i></div>
                <div class="link-text">
                    <span class="link-title">TikTok</span>
                    <span class="link-subtitle">Відеоогляди</span>
                </div>
                <div class="link-action"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

        </div>
    </div>

</body>
</html>
